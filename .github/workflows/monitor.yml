name: Monitorear Outlet Compra Gamer

on:
  schedule:
    # Se ejecuta cada 15 minutos (límite de fiabilidad óptimo para GitHub Actions)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la web de GitHub

permissions:
  contents: write # Requerido para poder hacer push de productos.json actualizado al repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node monitor.js

      - name: Hacer commit y push del catálogo actualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos.json
          # Solo hace commit si hay cambios detectados en productos.json
          if ! git diff --cached --exit-code; then
            git commit -m "🤖 Actualizar catálogo productos.json [skip ci]"
            git push
            echo "✅ Catálogo actualizado y subido al repositorio."
          else
            echo "ℹ️ No hubo cambios en el catálogo. Nada que guardar."
          fi
